[project]
name = "linkedin-job-agent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "PyPDF2>=3.0.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "openai>=1.0.0",
]

[tool.setuptools]
py-modules = ["main", "linkedin_scraper", "resume_tailor", "apply_link_resolver", "company_directory", "referral_complete", "batch"]

[project]
name = "linkedin-job-agent"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "linkedin-api>=2.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "PyPDF2>=3.0.0",
    "openai>=1.0.0",
    "reportlab>=4.0.0",
]

[tool.setuptools]
py-modules = ["main", "linkedin_agent", "linkedin_scraper", "resume_tailor"]
